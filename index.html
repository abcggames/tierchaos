<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Tierchaos · abcGgames</title>
  <link rel="icon" href="spiel.icon.png">
  <link rel="stylesheet" href="seite.css">
  <script src="playlist.js" defer></script>
  <script src="sprache.js" defer></script>
  <script src="musik.js?v=2" defer></script>
</head>
<body>
  <header>
    <strong>Tierchaos</strong>
    <button id="music-button" type="button" aria-expanded="false" aria-controls="music-panel">YouTube-Musik</button>
  </header>
  <main>
    <iframe class="game" src="spiel.html" title="Tierchaos – das Spiel"></iframe>
    <aside id="music-panel" aria-labelledby="music-title" hidden>
      <h2 id="music-title" data-i18n="music">Musik von YouTube</h2>
      <form id="playlist-form">
        <label for="playlist-link" data-i18n="media_link">YouTube-Link</label>
        <input id="playlist-link" name="playlist" type="url" placeholder="https://www.youtube.com/…" required>
        <button type="submit" data-i18n="load_media">Musik laden</button>
      </form>
      <p id="music-status" aria-live="polite"></p>
      <div id="player"></div>
      <button id="change-playlist" type="button" data-i18n="change_media" hidden>Link ändern</button>
    </aside>
  </main>
  <footer style="padding: 4px 12px; text-align: center; font-size: 0.75rem; color: #b3c7bc; border-top: 1px solid #38564a;">© 2026 abcGgames UG (haftungsbeschränkt)</footer>
</body>
</html>
